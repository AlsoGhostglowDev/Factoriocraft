# Configuration file

01_general {
    # How far from the center of the dimension can probes generate landing coordinates
    I:1.90_maxProbeDistance=32000

    # Should volcanoes be active when spawning, disabling will prevent natural volcanoes from spewing lava and growing
    B:1.91_enableVolcanoGen=true

    # To avoid biome ID collisions, the game will crash if one occurs, and give instructions on how to fix. Only disable this if you know what you're doing!
    B:1.92_crashOnBiomeConflict=true

    # How far from the center of the dimension can orbital stations be generated
    I:1.93_maxStationDistance=32000

    # Should ores indicate which planets they can be found on.
    B:1.93_showOreLocations=true

    # Whether combat pods should despawn after a certian amount of time.
    B:1.94_combatPodDespawn=false

    # Makes Kerbin (Overworld) skybox apply on all other planets, in case you're too lazy to adapt shaders' skyboxes to other planets by-hand. IMPORTANT NOTE FOR MODPACKERS: In shader pack's settings, enable vanilla clouds (or disable them entirely) and vanilla skybox/moon/sun if the pack you use has that option. That'll fix most (NOT ALL BUT MOST) shader-related issues.
    B:1.95_kerbinSkyboxEverywhere=true
}


